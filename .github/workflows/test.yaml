name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    # @clover
    uses: gechr/actions/.github/workflows/test.yaml@9c4087072c6cce173946d4546aa18625a317a7b0 # v0.2.11
    with:
      language: swift
      runs-on: '["macos-15","macos-26","xcode-27"]'
