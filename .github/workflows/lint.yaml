name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    # @clover
    uses: gechr/actions/.github/workflows/lint.yaml@b90a8ef9841510cc6325daf17d38e768d57d17b3 # v0.2.12
    with:
      language: swift
      runs-on: xcode-27
