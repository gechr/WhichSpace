name: zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    permissions:
      contents: read
      actions: read
      security-events: write
    # @clover
    uses: gechr/actions/.github/workflows/zizmor.yaml@b90a8ef9841510cc6325daf17d38e768d57d17b3 # v0.2.12
    with:
      advanced-security: "true"
